# warpgate's deployment, rendered by Argo CD with Meru's nuwa-app chart. Shikigami fills in what comes from the
# request (owner, size, route) and adds deploy/meru.yaml - the marker that makes Meru deploy this repo - once the
# app's namespace fence, signing key and build credentials exist. CI writes the image after each build; until the
# first one the digest is a placeholder: nuwa-app renders everything but the workload (the build runner comes up, no
# pod waits on an image that doesn't exist yet).
name: warpgate
owner: mario
image:
  repository: zot.clockmost.com/meru/warpgate
  digest: sha256:9ade5de2b16da00c690c5538315f1a5889f0bfd4f7d2cce2cab9fee25afc5ec5
  tag: "87fae1578b65"

# Warpgate serves only HTTPS, with the certificate below. Its data (SQLite, SSH keys, recordings) is on one volume.
port: 8888
extraPorts:
  - name: ssh
    port: 2222
    nodePort: 30222
heartbeat:
  path: /@warpgate/api/info
  scheme: HTTPS
args: [--config, /etc/warpgate/warpgate.yaml, --skip-securing-files, run]
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
certificate:
  enabled: true
# A restart would cut open sessions. Warpgate restarts only its HTTP listener when the certificate files change.
reloadsSecrets: true
persistence:
  - name: data
    mountPath: /data
    size: 10Gi
    storageClass: local
networkPolicy:
  enabled: true
  # NodePort traffic is checked here with the client's address, and this is the only gate on it: firewalld lets
  # anything Kubernetes redirected pass. So the LAN is listed, and the IoT network isn't.
  hostAddresses: [10.42.0.1/32, 172.16.0.0/12, 192.168.10.0/24]

# The whole config, because Warpgate can't read its client secret from anywhere else. clientSecret is at
# apps/meru/warpgate/eso/warpgate-config, copied from Authentik by the admin script meru-oidc-secret.sh.
# Ticket rules and targets live in Warpgate's database, not here.
externalSecrets:
  warpgate-config:
    mountPath: /etc/warpgate
    files:
      warpgate.yaml: |
        database_url: "sqlite:/data/db"
        external_host: warpgate.clockmost.com
        ssh:
          enable: true
          listen: "0.0.0.0:2222"
          external_port: 30222
          host_key_verification: auto_reject
          inactivity_timeout: 30m
        http:
          listen: "0.0.0.0:8888"
          external_port: 443
          certificate: /var/run/meru/tls/tls.crt
          key: /var/run/meru/tls/tls.key
          trust_x_forwarded_headers: true
        recordings:
          enable: true
          path: /data/recordings
        sso_providers:
          - name: authentik
            label: Authentik
            auto_create_users: true
            provider:
              type: custom
              client_id: warpgate
              client_secret: "{{ .clientSecret }}"
              issuer_url: https://auth.clockmost.com/application/o/warpgate/
              scopes: [openid, email, profile]
              admin_roles_claim: groups
              admin_role_mappings:
                warpgate-admins: warpgate:admin
